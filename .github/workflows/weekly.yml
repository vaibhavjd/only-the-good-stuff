name: Weekly Movie Finder

# Rebuilds the digest + browse dashboard every week and publishes them to GitHub Pages.
on:
  schedule:
    - cron: "30 2 * * 5"      # Fridays 02:30 UTC (~08:00 IST). Adjust as you like.
  workflow_dispatch:           # lets you run it on demand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config from secrets
        env:
          TMDB_BEARER: ${{ secrets.TMDB_BEARER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python - <<'PY'
          import json, os
          key = os.environ.get("TMDB_BEARER", "").strip()   # strip stray newline/space
          cfg = {"tmdb_bearer": key, "recent_years": 2,
                 "supabase_url": os.environ.get("SUPABASE_URL", "").strip(),
                 "supabase_anon_key": os.environ.get("SUPABASE_ANON_KEY", "").strip()}
          json.dump(cfg, open("config.json", "w"))
          print("config written; TMDB key:", bool(key), "| supabase:", bool(cfg["supabase_url"]))
          PY

      - name: Keep Supabase awake (free tier pauses after ~7 idle days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            # auth/v1/settings returns 200 for both legacy anon JWTs and new publishable keys
            curl -s -o /dev/null -w "supabase ping: HTTP %{http_code}\n" \
              "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_ANON_KEY" || true
          else
            echo "supabase not configured - skipping"
          fi

      - name: Build the site (digest + sentiment + browse + landing)
        run: python movie_finder.py site

      - name: Sanity check the build
        run: |
          test -f out/index.html
          test -f out/browse.html
          test -f out/digest-latest.html
          echo "build looks good"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
