name: Weekly build - Only the good stuff

# Rebuilds the app (movies + shows catalog) + digest every week and publishes to GitHub Pages.
on:
  schedule:
    - cron: "30 2 * * 5"      # Fridays 02:30 UTC (~08:00 IST). Adjust as you like.
  workflow_dispatch:           # lets you run it on demand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # ~39k TMDB enrichments since the catalog stopped being capped; well under this, but
    # explicit so a hung run fails in hours rather than burning the 6h default.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write config from secrets
        env:
          TMDB_BEARER: ${{ secrets.TMDB_BEARER }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python - <<'PY'
          import json, os
          key = os.environ.get("TMDB_BEARER", "").strip()   # strip stray newline/space
          cfg = {"tmdb_bearer": key, "recent_years": 2,
                 "supabase_url": os.environ.get("SUPABASE_URL", "").strip(),
                 "supabase_anon_key": os.environ.get("SUPABASE_ANON_KEY", "").strip()}
          json.dump(cfg, open("config.json", "w"))
          print("config written; TMDB key:", bool(key), "| supabase:", bool(cfg["supabase_url"]))
          PY

      - name: Keep Supabase awake (free tier pauses after ~7 idle days)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            # auth/v1/settings returns 200 for both legacy anon JWTs and new publishable keys
            curl -s -o /dev/null -w "supabase ping: HTTP %{http_code}\n" \
              "$SUPABASE_URL/auth/v1/settings" -H "apikey: $SUPABASE_ANON_KEY" || true
          else
            echo "supabase not configured - skipping"
          fi

      - name: Fetch previous deploy's catalog (keeps NEW badges honest)
        run: |
          curl -sf https://vaibhavjd.github.io/only-the-good-stuff/data.js -o prev-data.js \
            && echo "prev catalog fetched ($(wc -c < prev-data.js) bytes)" \
            || echo "no previous deploy - first run"

      - name: Build the site (digest + sentiment + catalog + app)
        run: python movie_finder.py site

      - name: Sanity check the build
        run: |
          test -f out/index.html
          test -f out/data.js
          grep -q 'MF_DATA' out/index.html || { echo "index.html is the placeholder page - templates/app.html missing?"; exit 1; }
          titles=$(grep -o '"t":' out/data.js | wc -l)
          echo "data.js titles: $titles"
          # A TMDB lookup failure silently drops that title, so a throttled run can still
          # produce a valid-but-gutted catalog. ~38.9k are expected; anything under 25k
          # means enrichment fell over and must not be deployed over a good catalog.
          test "$titles" -ge 25000 || { echo "catalog is short ($titles < 25000) - refusing to deploy"; exit 1; }
          echo "build looks good"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
